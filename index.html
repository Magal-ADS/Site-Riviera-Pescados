<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riviera Pescados | Qualidade que aparece no corte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="hero" style="background-image: url('assets/images/banner.jpg');"></section>

    <section class="recipes container">
        <div class="recipe-content">
            <div class="yellow-bar"></div>
            <h2>RECEITAS<br>ESPECIAIS</h2>
            <p>Aproveite e descubra todo o sabor e qualidade que os produtos da Riviera podem te oferecer.</p>
            <a href="#" class="btn-primary">Saiba Mais</a>
        </div>
        <div class="recipe-image-wrapper">
            <div class="blue-offset"></div>
            <img src="assets/images/receita-prato.jpg" alt="Prato de Tilápia Riviera" class="img-curved">
        </div>
    </section>

    <section class="products-area">
        <div class="products-header">
            <div class="yellow-label"><h3>CONHEÇA NOSSOS PRODUTOS</h3></div>
        </div>
        <div class="container products-grid">
            <div class="product-card"><img src="assets/images/produto-pacote.jpg" alt="Filé"><h4>Filé de Tilápia<br><strong>400g</strong></h4></div>
            <div class="product-card"><img src="assets/images/produto-pacote.jpg" alt="Filé"><h4>Filé de Tilápia<br><strong>400g</strong></h4></div>
            <div class="product-card"><img src="assets/images/produto-pacote.jpg" alt="Filé"><h4>Filé de Tilápia<br><strong>400g</strong></h4></div>
        </div>
    </section>

    <section class="social-media container">
        <h2>NOSSAS REDES SOCIAIS</h2>
        <div class="social-grid">
            <div class="social-item"><img src="assets/images/social-1.jpg" alt="Insta 1"></div>
            <div class="social-item"><img src="assets/images/social-2.jpg" alt="Insta 2"></div>
            <div class="social-item"><img src="assets/images/social-3.jpg" alt="Insta 3"></div>
        </div>
        <div class="social-footer"><a href="#" class="btn-secondary">Quero Seguir</a></div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="assets/js/main.js"></script>
</body>
</html>
