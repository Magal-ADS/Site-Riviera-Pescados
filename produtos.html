<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riviera Pescados | Nossos Produtos</title>
    <link rel="shortcut icon" href="assets/images/riviera.webp" type="image/x-icon">

    <link rel="stylesheet" href="assets/css/style.css">

<body>
    <div id="header-placeholder"></div>

    <section class="hero-produtos" style="background-image: url('assets/images/banner-produtos.webp');">

            <div class="yellow-box">
                <h1>NOSSOS<br>PRODUTOS</h1>
            </div>
        </div>
    </section>

    <section class="filters-section container">
        <span class="filter-label">Filtros:</span>

            <select><option>Categoria</option></select>

            <select><option>Tipo</option></select>

        <div class="catalog-row">
            <div class="container products-grid">
                <a href="produto-interna.html?id=file-400g" class="product-card">
                    <picture>
                        <source srcset="assets/images/Filé-de-Tilápia-400g.webp" type="image/webp">

                <a href="produto-interna.html?id=file-800g" class="product-card">

                        <img src="assets/images/File de Tilapia 800g.webp" alt="Filé de Tilápia 800g" onerror="this.onerror=null; this.src='assets/images/File de Tilapia 800g.webp';">

                    <h4>Filé de Tilápia<br><strong>800g</strong></h4>

                <a href="produto-interna.html?id=file-2kg" class="product-card">

        </div>

        <div class="catalog-row">
            <div class="container products-grid">
                <a href="produto-interna.html?id=isca-400g" class="product-card">
                    <picture>
                        <source srcset="assets/images/Isca de Tilapia 400g.webp" type="image/webp">
                        <img src="assets/images/Isca de Tilapia 400g.webp" alt="Isca de Tilápia 400g" onerror="this.onerror=null; this.src='assets/images/Isca de Tilapia 400g.webp';">
                    </picture>
                    <h4>Isca de Tilápia<br><strong>400g</strong></h4>
                </a>
                <a href="produto-interna.html?id=granel-10kg" class="product-card">
                    <picture>
                        <source srcset="assets/images/Filé-de-Tilápia-Granel-10-kg.webp" type="image/webp">

        <div class="container pagination">
            <a href="#" class="page-arrow">&larr; Anterior</a>
            <a href="#" class="page-num active">1</a>
            <a href="#" class="page-num">2</a>
            <a href="#" class="page-num">3</a>
