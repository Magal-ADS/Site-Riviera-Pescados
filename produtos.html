<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riviera Pescados | Nossos Produtos</title>
    <link rel="shortcut icon" href="assets/images/favicon.webp" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preload" as="image" href="assets/images/banner-produtos.webp">
    <link rel="preload" as="image" href="assets/images/riviera.webp">
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="hero-produtos" style="background-image: url('assets/images/banner-produtos.webp');">
        <div class="container hero-produtos-content">
            <div class="yellow-box">
                <h1>NOSSOS<br>PRODUTOS</h1>
            </div>
        </div>
    </section>

    <section class="filters-section container">
        <span class="filter-label">Filtros:</span>
        <div class="filter-selects">
            <select id="product-filter-category" aria-label="Filtrar por categoria">
                <option value="">Categoria</option>
            </select>
            <select id="product-filter-size" aria-label="Filtrar por tamanho">
                <option value="">Tamanho</option>
            </select>
            <select id="product-filter-type" aria-label="Filtrar por tipo">
                <option value="">Tipo</option>
            </select>
        </div>
    </section>

    <section class="catalog-section" data-products-catalog></section>

    <div id="footer-placeholder"></div>

    <script src="assets/js/products.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
