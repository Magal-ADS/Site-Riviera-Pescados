<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riviera Pescados | Receita Detalhada</title>
    <link rel="shortcut icon" href="assets/images/riviera.webp" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/produto-interna.css"> 
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="breadcrumb-section">
        <div class="container breadcrumb-nav">
            <a href="receitas.html" class="btn-voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </a>
            <p>Receitas > <strong id="recipe-breadcrumb">Carregando...</strong></p>
        </div>
    </div>

    <div class="product-banner-wrapper">
        <main class="product-details-container container">
            
            <div class="product-main-info">
                <div class="product-image-box">
                    <img id="recipe-image" src="assets/images/receita-prato.webp" alt="Prato Pronto">
                </div>

                <div class="product-text-info">
                    <h1 id="recipe-title" style="font-size: 2.5rem; margin-bottom: 20px;">Carregando Receita...</h1>
                    
                    <div class="product-icons" style="margin-bottom: 20px;">
                        <div class="icon-circle" style="font-size: 1.2rem;"><i class="fa-regular fa-clock"></i></div>
                        <span id="recipe-time" style="align-self: center; font-weight: bold; margin-right: 15px;">-- min</span>
                        
                        <div class="icon-circle" style="font-size: 1.2rem;"><i class="fa-solid fa-utensils"></i></div>
                        <span id="recipe-portions" style="align-self: center; font-weight: bold; margin-right: 15px;">-- porções</span>
                        
                        <div class="icon-circle" style="font-size: 1.2rem;"><i class="fa-solid fa-fire"></i></div>
                        <span id="recipe-difficulty" style="align-self: center; font-weight: bold;">--</span>
                    </div>
                    
                    <div style="background-color: var(--amarelo); padding: 15px; border-radius: 4px; margin-bottom: 30px;">
                        <h4 style="color: var(--azul-escuro); margin-bottom: 5px;"><i class="fa-solid fa-lightbulb"></i> Dica Riviera:</h4>
                        <p id="recipe-tip" style="color: var(--texto-dark); font-size: 0.95rem;">Aproveite o melhor sabor do pescado com os produtos Riviera.</p>
                    </div>
                </div>
            </div>

            <div class="product-accordions">
                <details class="custom-accordion" open>
                    <summary>🧾 Ingredientes <i class="fa-solid fa-chevron-down"></i></summary>
                    <div class="accordion-content">
                        <ul id="recipe-ingredients" style="padding-left: 20px; line-height: 1.8;">
                            <!-- Dinâmico -->
                        </ul>
                    </div>
                </details>
                
                <details class="custom-accordion">
                    <summary>👩‍🍳 Modo de preparo <i class="fa-solid fa-chevron-down"></i></summary>
                    <div class="accordion-content">
                        <ol id="recipe-steps" style="padding-left: 20px; line-height: 1.8;">
                            <!-- Dinâmico -->
                        </ol>
                    </div>
                </details>
            </div>
        </main>
    </div>

    <div id="footer-placeholder"></div>
    <script src="assets/js/recipes.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
